<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Personagens</title>
</head>
<body>
    <h1>Lista de Personagens</h1>
    <ul>
        {% for personagem in personagens %}
            <li><a href="{% url 'personagem_detalhe' personagem.id %}">{{ personagem.nome }} - {{ personagem.classe }}</a></li>
        {% endfor %}
    </ul>
    <button onclick="location.href='{% url 'personagem_criar' %}'">Criar Novo Personagem</button>
</body>
</html>
