<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletar Personagem</title>
</head>
<body>

    <h1>Deletar Personagem</h1>
    <p>Você tem certeza que deseja deletar {{ personagem.nome }}?</p>

    <form action = "" method="POST">
        {% csrf_token %}
        <button type="submit">Confirmar</button>
    </form>

    <button onclick="location.href='{% url 'personagem_lista' %}'">Cancelar</button>

</body>
</html>
